# Builds the Android shell. Produces a debug APK you can sideload, and an
# unsigned release bundle. Signing for Google Play is added once a keystore
# exists; until then this is a compile check plus a testable artifact.
name: Android

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-24.04 ships JDK 17 (the default) and the Android SDK; nothing to install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Copies web/ into the shell. The copy is gitignored, so this must run in CI.
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      # On failure, the relevant part of Gradle's output is re-emitted as
      # annotations so it's readable from the public API without the job log.
      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain assembleDebug bundleRelease 2>&1 | tee build.log; then
            grep -nE 'FAILURE|What went wrong|error:|Exception|Could not|not found|Unsupported|requires' build.log \
              | head -25 | while read -r l; do echo "::error title=Gradle::${l:0:900}"; done
            exit 1
          fi
      # Surfaces the real output paths as annotations, for the same reason.
      - name: List outputs
        run: |
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) \
            | while read -r f; do echo "::notice title=Build output::$f"; done
      - uses: actions/upload-artifact@v7
        with:
          name: overload-android-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: overload-android-release-aab
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
